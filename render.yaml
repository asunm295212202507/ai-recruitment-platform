services:
  # 1. Enterprise Web Application Frontend (100% Free - No Credit Card Required)
  - type: web
    name: ai-recruitment-frontend
    env: static
    plan: free
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. FastAPI Backend Service (100% Free Tier)
  - type: web
    name: ai-recruitment-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: SECRET_KEY
        generateValue: true
