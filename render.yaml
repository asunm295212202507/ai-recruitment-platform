services:
  # 1. Frontend Web Application (Static Site)
  - type: web
    name: ai-recruitment-frontend
    env: static
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # 2. Backend FastAPI Service (Docker)
  - type: web
    name: ai-recruitment-backend
    env: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        fromDatabase:
          name: recruitment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  # 3. Managed PostgreSQL Database
  - name: recruitment-db
    databaseName: recruitment_db
